services:
  - type: web
    name: campuspulse-backend
    env: java
    buildCommand: mvn clean install -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/campuspulse-backend-1.0.0.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campuspulse-db
          property: connectionString
    
databases:
  - name: campuspulse-db
    databaseName: campuspulse
    user: campuspulse
