# Production Configuration for Render.com

# Database Configuration (PostgreSQL from Aiven)
# Spring Boot will automatically read SPRING_DATASOURCE_URL from environment
# We'll use SPRING_DATASOURCE_URL in Render instead of DATABASE_URL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration  
server.port=${PORT:10000}

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.jpa.defer-datasource-initialization=true

# Disable H2 Console in production
spring.h2.console.enabled=false

# Log datasource info
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
